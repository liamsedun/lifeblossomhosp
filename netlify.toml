[build]
  command   = "npm run build"
  # publish omitted — Netlify Next.js Runtime manages its own output
  functions = "netlify/functions"

[build.environment]
  # Let the Netlify Next.js Runtime handle output mode
  NEXT_PRIVATE_STANDALONE = "false"

# ─── Netlify Next.js Runtime ─────────────────────────────────────
# Netlify auto-detects Next.js. This section pins the required
# plugin version and configures the cache.
[[plugins]]
  package = "@netlify/plugin-nextjs"
  [plugins.inputs]
    # Exclude middleware from edge (force Lambda) if you hit
    # edge-function size limits
    # excludeMiddleware = false

# ─── Security & Cache Headers ────────────────────────────────────
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    X-Frame-Options           = "DENY"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# ─── Redirects ───────────────────────────────────────────────────
# Next.js App Router handles all routing natively.
# No redirects needed unless adding legacy URL support.
